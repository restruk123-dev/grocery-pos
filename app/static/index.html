<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GroceryStore POS & Accounting (UZS)</title>

  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta id="meta-theme-color" name="theme-color" content="#0A0F24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GroceryPOS">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <!-- Immediate Theme Initializer -->
  <script>
    try {
      const savedTheme = localStorage.getItem('pos_theme') || 'dark';
      const meta = document.getElementById('meta-theme-color');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
        if (meta) meta.setAttribute('content', '#EEF2FF');
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
        if (meta) meta.setAttribute('content', '#0A0F24');
      }
    } catch (e) {}
  </script>

  <!-- Compiled Tailwind CSS + Royal Indigo Glass 3D Design System -->
  <link rel="stylesheet" href="/static/app.css?v=12">

  <!-- React 18 Standalone UMD -->
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>

  <!-- HTML5 QR & Barcode Camera Scanner (Local Vendor) -->
  <script src="/static/vendor/html5-qrcode.min.js"></script>

  <!-- Local Tesseract OCR for Paper Debt Notebooks & Invoices -->
  <script src="/static/vendor/tesseract.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { width: 100%; min-width: 0; max-width: 100%; overflow-x: hidden; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: -0.005em;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.35); border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.55); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .touch-target { min-height: 40px; min-width: 40px; }
    .app-viewport {
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .app-header-identity, .app-header-actions, .app-tab-nav, main { min-width: 0; }
    input, select, textarea, button { max-width: 100%; }
    .modal-mobile-safe {
      max-height: 92dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (max-width: 640px) {
      .touch-target { min-height: 38px; min-width: 38px; }
    }
    @keyframes laserScan {
      0% { top: 10%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 10%; opacity: 0.8; }
    }
    .laser-line {
      position: absolute;
      left: 5%;
      width: 90%;
      height: 2.5px;
      background: #34D399;
      box-shadow: 0 0 14px 2px #34D399;
      animation: laserScan 2s infinite ease-in-out;
    }
    @media print {
      body * { visibility: hidden; }
      #printable-receipt, #printable-receipt * { visibility: visible; }
      #printable-receipt { position: absolute; left: 0; top: 0; width: 80mm; }
    }
  </style>
</head>
<body class="atelier-app min-h-screen antialiased select-none md:select-auto transition-colors duration-200">
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-app, #0A0F24); color: var(--text-main, #F8FAFC);">
      <div style="text-align: center;">
        <div style="width: 56px; height: 56px; border-radius: 18px; margin: 0 auto 14px; background: linear-gradient(135deg,#6366F1,#3B82F6); color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(99,102,241,0.45);">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        </div>
        <div style="font-weight: 700; font-size: 1.15rem; letter-spacing: -0.01em;">GroceryStore POS</div>
        <div style="color: #A5B4FC; font-size: 0.82rem; margin-top: 0.35rem;">Yuklanmoqda / Загрузка...</div>
      </div>
    </div>
  </div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => { if (reg && reg.update) reg.update(); })
          .catch(() => {});
      });
    }
  </script>

  <!-- React Standalone Application -->
  <script src="/static/app.js?v=12"></script>
</body>
</html>
