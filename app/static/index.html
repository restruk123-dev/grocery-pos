<!DOCTYPE html>
<html lang="uz" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>GroceryStore POS & Accounting (UZS)</title>
  
  <!-- PWA Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#10b981">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GroceryPOS">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">

  <!-- Immediate Theme Initializer to prevent flashing -->
  <script>
    try {
      const savedTheme = localStorage.getItem('pos_theme') || 'dark';
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.remove('light');
        document.documentElement.classList.add('dark');
      }
    } catch (e) {}
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    if (window.tailwind) {
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#ecfdf5',
                100: '#d1fae5',
                500: '#10b981',
                600: '#059669',
                700: '#047857'
              }
            }
          }
        }
      };
    }
  </script>

  <!-- React 18 Standalone UMD -->
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>

  <!-- HTML5 QR & Barcode Camera Scanner (Local Vendor) -->
  <script src="/static/vendor/html5-qrcode.min.js"></script>

  <!-- Free Client-Side Tesseract OCR for Paper Debt Notebooks & Invoices -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    :root {
      color-scheme: light dark;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body, #root { width: 100%; min-width: 0; max-width: 100%; overflow-x: hidden; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
    }
    .app-header-identity, .app-header-actions, .app-tab-nav, main { min-width: 0; }
    .app-tab-nav > button { flex: 0 0 auto; }
    input, select, textarea, button { max-width: 100%; }
    @media (max-width: 640px) {
      .app-header-top { align-items: stretch; flex-direction: column !important; gap: .35rem; }
      .app-header-identity { justify-content: space-between; width: 100%; flex-wrap: wrap; }
      .app-header-actions { justify-content: flex-end; flex-wrap: wrap; width: 100%; }
      .app-tab-nav { display: grid !important; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 100%; gap: .35rem; overflow: visible; }
      .app-tab-nav > button { min-width: 0; width: 100%; white-space: normal; overflow-wrap: anywhere; line-height: 1.25; padding: .55rem .45rem; }
      .app-main-content { padding-left: .5rem; padding-right: .5rem; }
      .modal-mobile-safe { max-height: calc(100dvh - 1.5rem); overflow-y: auto; }
    }
    /* Viewfinder scanning reticle */
    @keyframes laserScan {
      0% { top: 10%; opacity: 0.8; }
      50% { top: 90%; opacity: 1; }
      100% { top: 10%; opacity: 0.8; }
    }
    .laser-line {
      position: absolute;
      left: 5%;
      width: 90%;
      height: 2.5px;
      background: #10b981;
      box-shadow: 0 0 12px 2px #10b981;
      animation: laserScan 2s infinite ease-in-out;
    }
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-receipt, #printable-receipt * {
        visibility: visible;
      }
      #printable-receipt {
        position: absolute;
        left: 0;
        top: 0;
        width: 80mm;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 dark:bg-slate-950 dark:text-slate-100 min-h-screen antialiased select-none md:select-auto transition-colors duration-200">
  <div id="root">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #020617; color: #10b981; font-family: sans-serif;">
      <div style="text-align: center;">
        <div style="font-size: 3rem; margin-bottom: 1rem;">🛒</div>
        <div style="font-weight: 700; font-size: 1.25rem; letter-spacing: 0.05em;">GroceryStore POS</div>
        <div style="color: #64748b; font-size: 0.875rem; margin-top: 0.5rem;">Yuklanmoqda / Загрузка терминала...</div>
      </div>
    </div>
  </div>

  <!-- PWA Service Worker Registration -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('Service Worker registered:', reg.scope))
          .catch(err => console.log('Service Worker failed:', err));
      });
    }
  </script>

  <!-- React Standalone Application -->
  <script src="/static/app.js"></script>
</body>
</html>
